# Manifest for `tt dotfiles` (toolbelt). Layered first: dotfiles-private overlays this.
visibility = "public"

# Personal instructions are canonical in AGENTS.md; Claude gets a compatibility link.
[[link]]
src = "home/.codex/AGENTS.md"
dest = "~/.codex/AGENTS.md"

[[link]]
src = "~/.codex/AGENTS.md"
dest = "~/.claude/CLAUDE.md"

# ~/.claude itself is a real directory full of runtime state, so
# only individual entries are linked.

[[link]]
src = "home/.claude/settings.json"
dest = "~/.claude/settings.json"

[[link]]
src = "home/.claude/statusline-command.sh"
dest = "~/.claude/statusline-command.sh"

[[link]]
src = "home/.claude/plugins/config.json"
dest = "~/.claude/plugins/config.json"

[[link]]
src = "home/.claude/agents"
dest = "~/.claude/agents"
kind = "dir"

[[link]]
src = "home/.claude/commands"
dest = "~/.claude/commands"
kind = "dir"

[[link]]
src = "home/.claude/skills"
dest = "~/.agents/skills"
kind = "merge_dir"

# Shared skills live under ~/.agents; Claude gets compatibility links.
# Each app manages its own account-synced skills.
[[link]]
src = "~/.agents/skills"
dest = "~/.claude/skills"
kind = "merge_dir"
exclude = ["synced"]

# Cursor
[[link]]
src = "home/.cursor/commands"
dest = "~/.cursor/commands"
kind = "dir"

[[link]]
src = "home/.cursor/hooks"
dest = "~/.cursor/hooks"
kind = "dir"

[[link]]
src = "home/.cursor/hooks.json"
dest = "~/.cursor/hooks.json"

[[link]]
src = "home/Library/Application Support/Cursor/User/keybindings.json"
dest = "~/Library/Application Support/Cursor/User/keybindings.json"

[[link]]
src = "home/Library/Application Support/Cursor/User/settings.json"
dest = "~/Library/Application Support/Cursor/User/settings.json"

[[link]]
src = "home/Library/Application Support/Cursor/User/snippets"
dest = "~/Library/Application Support/Cursor/User/snippets"
kind = "dir"

# VS Code
[[link]]
src = "home/Library/Application Support/Code/User/keybindings.json"
dest = "~/Library/Application Support/Code/User/keybindings.json"

[[link]]
src = "home/Library/Application Support/Code/User/settings.json"
dest = "~/Library/Application Support/Code/User/settings.json"

# ~/.config
[[link]]
src = "home/.config/alacritty/alacritty.toml"
dest = "~/.config/alacritty/alacritty.toml"

[[link]]
src = "home/.config/direnv/direnv.toml"
dest = "~/.config/direnv/direnv.toml"

[[link]]
src = "home/.config/direnv/direnvrc"
dest = "~/.config/direnv/direnvrc"

[[link]]
src = "home/.config/ghostty/config"
dest = "~/.config/ghostty/config"

[[link]]
src = "home/.config/git/attributes"
dest = "~/.config/git/attributes"

[[link]]
src = "home/.config/git/ignore"
dest = "~/.config/git/ignore"

[[link]]
src = "home/.config/skhd/skhdrc"
dest = "~/.config/skhd/skhdrc"

[[link]]
src = "home/.config/starship.toml"
dest = "~/.config/starship.toml"

[[link]]
src = "home/.config/yabai/yabairc"
dest = "~/.config/yabai/yabairc"

# Other apps
[[link]]
src = "home/Library/Application Support/k9s/config.yaml"
dest = "~/Library/Application Support/k9s/config.yaml"

[[link]]
src = "home/Library/LaunchAgents/com.user.docker.desktop.plist"
dest = "~/Library/LaunchAgents/com.user.docker.desktop.plist"

# `tt ui` as a login service: http://127.0.0.1:8765
[[link]]
src = "home/Library/LaunchAgents/com.user.toolbelt.ui.plist"
dest = "~/Library/LaunchAgents/com.user.toolbelt.ui.plist"

# Shell and tool config in $HOME
[[link]]
src = "home/.default-npm-packages"
dest = "~/.default-npm-packages"

[[link]]
src = "home/.editorconfig"
dest = "~/.editorconfig"

[[link]]
src = "home/.gitconfig"
dest = "~/.gitconfig"

[[link]]
src = "home/.tmux.conf"
dest = "~/.tmux.conf"

[[link]]
src = "home/.tool-versions"
dest = "~/.tool-versions"

[[link]]
src = "home/.zfunc"
dest = "~/.zfunc"
kind = "dir"

[[link]]
src = "home/.zprofile"
dest = "~/.zprofile"

[[link]]
src = "home/.zshenv"
dest = "~/.zshenv"

[[link]]
src = "home/.zshrc"
dest = "~/.zshrc"
